      <stop offset=".5" stop-color="#FF9544" stop-opacity=".09"/>
      <stop offset="1" stop-color="#FF9544" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#25313F"/>
      <stop offset="1" stop-color="#111B25"/>
    </linearGradient>
