<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="420" viewBox="0 0 1240 420" role="img" aria-labelledby="title desc">
  <title id="title">SofaPotatoes — Build. Host. Create.</title>
  <desc id="desc">An editorial dark navy and orange banner for SofaPotatoes, an infrastructure and software studio.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0D131A"/>
      <stop offset=".56" stop-color="#111B25"/>
      <stop offset="1" stop-color="#18212A"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#FFBB78"/>
      <stop offset=".56" stop-color="#FF9544"/>
      <stop offset="1" stop-color="#E56A25"/>
    </linearGradient>
    <radialGradient id="aura">
