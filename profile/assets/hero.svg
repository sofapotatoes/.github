    <text x="105" y="257" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#98A9B8">Digital infrastructure and experiences,</text>
    <text x="105" y="281" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#98A9B8">engineered for communities.</text>

